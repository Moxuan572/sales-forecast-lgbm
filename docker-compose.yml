services:
  api:
    image: sales-forecast-api:latest
    container_name: sales-forecast-api
    networks:
      - app-net
    restart: always

  nginx:
    image: nginx:alpine
    container_name: sales-forecast-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - app-net
    restart: always

networks:
  app-net:
    driver: bridge
